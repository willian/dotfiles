[tools]
bun = ["latest"]
claude-code = ["latest"]
codex = ["latest"]
go = ["1.26.4"]
lua = ["5.5"]
node = ["26.7.0"]
opencode = ["latest"]
pi = ["latest"]
ruby = ["latest"]
rust = ["1.97.1"]
viteplus = ["latest"]
workmux = ["latest"]

[settings]
idiomatic_version_file_enable_tools = ["ruby"]
legacy_version_file = true
minimum_release_age_excludes = [
  "claude-code",
  "codex",
  "opencode",
  "pi",
  "ruby",
  "workmux",
]

[env]
CLAUDE_CONFIG_DIR = "{{env.HOME}}/.claude"
